name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o CI só lê o código (repositório público).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: familia
          POSTGRES_PASSWORD: familia
          POSTGRES_DB: familia_segura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U familia -d familia_segura"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://familia:familia@localhost:5432/familia_segura
      TEST_DATABASE_URL: postgres://familia:familia@localhost:5432/familia_segura_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm --filter @workspace/api-server run test

  android-native:
    # Compila o módulo nativo Android (Kotlin) do controle parental. Os runners do GitHub já têm o Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Prebuild Android
        working-directory: artifacts/familia-segura
        run: npx expo prebuild --platform android --no-install --clean
      - name: Compilar módulo Kotlin
        working-directory: artifacts/familia-segura/android
        run: ./gradlew :familia-segura-android-controls:compileDebugKotlin --no-daemon --stacktrace

  ios-native:
    # Compila o app iOS (módulo Swift próprio + extensões Screen Time) para simulador, sem assinatura.
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Selecionar Xcode mais novo
        # Expo 57 (expo-modules-jsi) é feito para o Xcode 27; o 26.3 rejeita as anotações de interop C++.
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_2[6-9]*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prebuild iOS
        working-directory: artifacts/familia-segura
        # --no-install: sem perguntas interativas no CI; os pods são instalados na etapa seguinte.
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Instalar pods
        working-directory: artifacts/familia-segura/ios
        run: pod install
      - name: Compilar para simulador
        working-directory: artifacts/familia-segura/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && STATUS=0 || STATUS=$?
          tail -30 build.log
          if [ "$STATUS" -ne 0 ]; then
            echo "===== primeiros erros ====="
            grep -n -E "error:|fatal error|The following build commands failed" build.log | head -40
            grep -n -B2 -A12 "The following build commands failed" build.log | head -40
          fi
          xcodebuild -version
          echo "===== grafo de dependências ====="
          grep -n -A40 "Target dependency graph" build.log | head -60
          exit $STATUS
      - name: Guardar log do build iOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            artifacts/familia-segura/ios/build.log
            artifacts/familia-segura/ios/Podfile
            artifacts/familia-segura/ios/Podfile.properties.json
          if-no-files-found: ignore
