name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: familia
          POSTGRES_PASSWORD: familia
          POSTGRES_DB: familia_segura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U familia -d familia_segura"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://familia:familia@localhost:5432/familia_segura
      TEST_DATABASE_URL: postgres://familia:familia@localhost:5432/familia_segura
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/db run migrate
      - run: pnpm --filter @workspace/api-server run test
