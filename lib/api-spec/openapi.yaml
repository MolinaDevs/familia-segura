openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: API segura do Família Segura
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: family
  - name: devices
  - name: rules
  - name: requests
  - name: privacy
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /family:
    get:
      operationId: getFamilyOverview
      tags: [family]
      responses:
        "200":
          description: Family overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyOverview"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createFamily
      tags: [family]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyInput"
      responses:
        "201":
          description: Family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyOverview"
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      operationId: deleteFamily
      tags: [privacy]
      responses:
        "204":
          description: Family deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /family/children:
    post:
      operationId: createChild
      tags: [family]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildInput"
      responses:
        "201":
          description: Child created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /family/pairing-codes:
    post:
      operationId: createPairingCode
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCodeInput"
      responses:
        "201":
          description: Temporary pairing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /family/devices/pair:
    post:
      operationId: pairDevice
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePairInput"
      responses:
        "201":
          description: Device paired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairResult"
        "400": { $ref: "#/components/responses/BadRequest" }
  /child/overview:
    get:
      operationId: getChildOverview
      tags: [family]
      responses:
        "200":
          description: Child-facing rules and transparency summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildOverview"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /child/usage:
    post:
      operationId: syncChildUsage
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUsageInput"
      responses:
        "204":
          description: Allowed usage metrics synchronized
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /child/protection:
    post:
      operationId: syncChildProtection
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProtectionInput"
      responses:
        "204":
          description: Device protection state synchronized
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /family/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Device revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /family/apps/{appId}/rules:
    patch:
      operationId: updateAppRule
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRuleUpdate"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRule"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /family/routines/{routineId}:
    patch:
      operationId: updateRoutine
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineUpdate"
      responses:
        "200":
          description: Routine updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /family/time-requests:
    post:
      operationId: createTimeRequest
      tags: [requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeRequest"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /family/time-requests/{requestId}:
    patch:
      operationId: resolveTimeRequest
      tags: [requests]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeRequestResolution"
      responses:
        "200":
          description: Request resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeRequest"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /family/audit:
    get:
      operationId: listAuditEvents
      tags: [privacy]
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /family/export:
    get:
      operationId: exportFamilyData
      tags: [privacy]
      responses:
        "200":
          description: Portable family data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyExport"
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  parameters:
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string, format: uuid }
    AppId:
      in: path
      name: appId
      required: true
      schema: { type: string }
    RoutineId:
      in: path
      name: routineId
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      in: path
      name: requestId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Owner access required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    FamilyInput:
      type: object
      required: [name, guardianName, childName, childBirthYear, consentAccepted]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        guardianName: { type: string, minLength: 2, maxLength: 80 }
        childName: { type: string, minLength: 1, maxLength: 50 }
        childBirthYear: { type: integer, minimum: 2008, maximum: 2026 }
        consentAccepted: { type: boolean }
    ChildInput:
      type: object
      required: [displayName, birthYear]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 50 }
        birthYear: { type: integer, minimum: 2008, maximum: 2026 }
    PairingCodeInput:
      type: object
      required: [childId]
      properties:
        childId: { type: string, format: uuid }
    DevicePairInput:
      type: object
      required: [code, name, platform]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        name: { type: string, minLength: 1, maxLength: 80 }
        platform: { type: string, enum: [ios, android] }
    DeviceUsageInput:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          maxItems: 50
          items:
            type: object
            required: [appId, usageTodayMinutes]
            properties:
              appId: { type: string, minLength: 1, maxLength: 100 }
              usageTodayMinutes: { type: integer, minimum: 0, maximum: 1440 }
    DeviceProtectionInput:
      type: object
      required: [state, issues]
      properties:
        state: { type: string, enum: [active, partial, disabled, unavailable] }
        issues:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 80 }
    AppRuleUpdate:
      type: object
      required: [childId]
      properties:
        childId: { type: string, format: uuid }
        status: { type: string, enum: [allowed, attention, blocked] }
        dailyLimitMinutes: { type: integer, minimum: 0, maximum: 1440 }
    RoutineUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        startTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        endTime: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        enabled: { type: boolean }
    TimeRequestInput:
      type: object
      required: [childId, appId, requestedMinutes, message]
      properties:
        childId: { type: string, format: uuid }
        appId: { type: string }
        requestedMinutes: { type: integer, minimum: 5, maximum: 120 }
        message: { type: string, maxLength: 240 }
    TimeRequestResolution:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, denied] }
    Family:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    FamilyMember:
      type: object
      required: [id, displayName, role]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [owner, guardian] }
    ChildProfile:
      type: object
      required: [id, displayName, birthYear]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        birthYear: { type: integer }
    Device:
      type: object
      required: [id, childId, name, platform, status, protectionState, protectionIssues, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string, enum: [ios, android] }
        status: { type: string, enum: [active, offline, revoked] }
        protectionState: { type: string, enum: [unknown, active, partial, disabled, unavailable] }
        protectionIssues:
          type: array
          items: { type: string }
        protectionUpdatedAt: { type: [string, "null"], format: date-time }
        lastSeenAt: { type: string, format: date-time }
    DevicePairResult:
      type: object
      required: [device, deviceToken]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        deviceToken: { type: string }
    PairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
    AppRule:
      type: object
      required: [id, childId, appId, appName, category, icon, iconColor, usageTodayMinutes, dailyLimitMinutes, status]
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        appId: { type: string }
        appName: { type: string }
        category: { type: string }
        icon: { type: string }
        iconColor: { type: string }
        usageTodayMinutes: { type: integer }
        dailyLimitMinutes: { type: integer }
        status: { type: string, enum: [allowed, attention, blocked] }
    Routine:
      type: object
      required: [id, childId, title, description, days, startTime, endTime, enabled, icon]
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        days: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        enabled: { type: boolean }
        icon: { type: string }
    TimeRequest:
      type: object
      required: [id, childId, childName, appId, appName, requestedMinutes, message, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        childId: { type: string, format: uuid }
        childName: { type: string }
        appId: { type: string }
        appName: { type: string }
        requestedMinutes: { type: integer }
        message: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, summary, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
    PrivacySummary:
      type: object
      required: [consentAcceptedAt, retentionDays, collectedData]
      properties:
        consentAcceptedAt: { type: string, format: date-time }
        retentionDays: { type: integer }
        collectedData:
          type: array
          items: { type: string }
    FamilyOverview:
      type: object
      required: [family, members, children, devices, apps, routines, timeRequests, privacy]
      properties:
        family: { $ref: "#/components/schemas/Family" }
        members:
          type: array
          items: { $ref: "#/components/schemas/FamilyMember" }
        children:
          type: array
          items: { $ref: "#/components/schemas/ChildProfile" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppRule" }
        routines:
          type: array
          items: { $ref: "#/components/schemas/Routine" }
        timeRequests:
          type: array
          items: { $ref: "#/components/schemas/TimeRequest" }
        privacy: { $ref: "#/components/schemas/PrivacySummary" }
    ChildOverview:
      type: object
      required: [child, apps, routines, collectedData]
      properties:
        child: { $ref: "#/components/schemas/ChildProfile" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/AppRule" }
        routines:
          type: array
          items: { $ref: "#/components/schemas/Routine" }
        collectedData:
          type: array
          items: { type: string }
    FamilyExport:
      type: object
      required: [exportedAt, data, auditEvents]
      properties:
        exportedAt: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/FamilyOverview" }
        auditEvents:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }