# Infraestrutura de produção como código (Render Blueprint).
# No painel do Render: New → Blueprint → escolher este repositório. O Render cria a API e o banco.
# Variáveis com `sync: false` são pedidas na criação (valores secretos nunca ficam no repositório).
# Guia completo: docs/INFRAESTRUTURA.md
services:
  - type: web
    name: familia-segura-api
    runtime: node
    region: virginia
    plan: 0.5c-512mb         # 0,5 CPU / 512 MB, pago: o grátis desliga quando parado (quebraria alertas e sincronização)
    branch: main
    autoDeployTrigger: checksPass   # só publica depois que o CI do GitHub passar
    # "corepack pnpm" usa o pnpm fixado no package.json sem instalar atalho em /usr/bin (somente leitura no Render).
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm --filter @workspace/api-server run build
    preDeployCommand: corepack pnpm --filter @workspace/db run migrate   # migrações antes de a versão nova receber tráfego
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/readyz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT   # baixa o pnpm sem pedir confirmação
        value: "0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: familia-segura-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: REVENUECAT_PROJECT_ID
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      # Id interno do entitlement "premium" (não é segredo): a API v2 da RevenueCat só devolve este id.
      - key: REVENUECAT_PREMIUM_ENTITLEMENT_ID
        value: entlfc138e56ed
      - key: LEGAL_CONTROLLER_NAME
        sync: false
      - key: LEGAL_CONTROLLER_CNPJ
        sync: false
      - key: LEGAL_DPO_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Só durante o beta (compras de teste do TestFlight/teste fechado). No lançamento: "false".
      - key: PREMIUM_ACCEPT_SANDBOX
        value: "true"

databases:
  - name: familia-segura-db
    databaseName: familia_segura
    user: familia
    region: virginia
    plan: 0.1c-256mb         # menor plano pago (com backup); subir quando o banco crescer
    postgresMajorVersion: "16"
    ipAllowList: []          # sem acesso pela internet: só a API, pela rede privada do Render
